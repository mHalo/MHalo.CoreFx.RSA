<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RSA ToolBox</title>
  </head>
  <body>
    <div id="app">
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;gap:10px;font-family:system-ui,sans-serif;color:#666;">
        <svg width="24" height="24" viewBox="0 0 24 24" style="animation:spin 1s linear infinite">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#e5e5e5" stroke-width="3" />
          <circle cx="12" cy="12" r="10" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="40 60" stroke-linecap="round" />
        </svg>
        <span style="font-size:14px;">正在加载 RSA ToolBox...</span>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script>
      function showError(label, msg, stack) {
        const el = document.getElementById('app')
        el.textContent = ''
        const pre = document.createElement('pre')
        pre.style.cssText = 'color:red;padding:1em;font-family:monospace;white-space:pre-wrap'
        pre.textContent = label + ': ' + msg + (stack ? '\n' + stack : '')
        el.appendChild(pre)
      }
      window.addEventListener('error', (e) => {
        showError('ERROR', e.message, e.error?.stack)
      })
      window.addEventListener('unhandledrejection', (e) => {
        showError('UNHANDLED REJECTION', e.reason, '')
      })
    </script>
    <script type="module">
      // Preload the .NET WASM host and stash it on globalThis.
      // The import path bypasses Vite's module transform because the file
      // lives at <root>/wasm-core/ and is served by the Vite dev server's
      // static file middleware (configured in vite.config.ts).
      const dotnetModule = await import('/wasm-core/wwwroot/_framework/dotnet.js')
      globalThis.__dotnetHost = dotnetModule.dotnet
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
